# Fails a push or pull request whose commits touch another lane's paths.
# Copy to .github/workflows/check-lanes.yml. Commits without a `Lane:` trailer are reported, not failed.
name: check-lanes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-lanes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a shallow clone skips its oldest commit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check lane ownership
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then RANGE="origin/$BASE_REF..HEAD"; else RANGE="$BEFORE..$SHA"; fi
          npx --yes compounding-loop check-lanes --range "$RANGE"
