name: Demo site
# Publishes the static five-site demo to https://minntooos.github.io/Compounding-Loop/ (Pages source: GitHub Actions).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'demo/**', 'src/server/**', 'vite.config.ts', 'package-lock.json', '.github/workflows/demo-pages.yml']
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node demo/export-static.mjs
      - run: cp -R demo/static/. dist/web/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - uses: actions/deploy-pages@v4
