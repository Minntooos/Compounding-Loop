name: Demo site
# Manual only: the owner enables GitHub Pages and runs this when ready to publish the static demo.
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node demo/export-static.mjs
      - run: cp -R demo/static/. dist/web/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web
      - uses: actions/deploy-pages@v4
