name: Release
# Publishes to npm with trusted publishing (OIDC): no token or secret is stored anywhere.
# Start it from the dashboard's Release button or Actions -> Release -> Run workflow. The `release`
# environment holds the required reviewer; setup is in docs/release.md.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run every check and the packaging, then stop before publish, tag and release'
        type: boolean
        default: true
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Ship check
        run: node bin/loop.js ship-check
      - name: Version is not on npm yet
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm: bump the version first." >&2
            exit 1
          fi
      - name: Pack
        run: npm pack --dry-run
      - name: Release notes from CHANGELOG
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex((l) => l.startsWith("## [" + version + "]"));
            if (start < 0) { console.error("No CHANGELOG section for " + version); process.exit(1); }
            const end = lines.findIndex((l, i) => i > start && l.startsWith("## ["));
            fs.writeFileSync(process.env.RUNNER_TEMP + "/notes.md", lines.slice(start + 1, end < 0 ? undefined : end).join("\n").trim() + "\n");
          ' "$VERSION"
      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        # Trusted publishing needs npm 11.5.1 or newer, and no token in the environment.
        run: |
          npm install -g npm@latest
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public
      - name: Tag and GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; the package is published, create the release by hand." >&2
            exit 1
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Dry run stops here
        if: ${{ inputs.dry-run }}
        run: echo "Dry run passed. Nothing was published, tagged or released."
