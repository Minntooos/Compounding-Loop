name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # engines says node >=20; Windows is covered because path and process bugs only show up there.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Lane ownership
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        # Advisory until older lane commits that predate the ownership rules age out of the range.
        continue-on-error: true
        run: node bin/loop.js check-lanes --range origin/main~20..HEAD
